# XcodeGen spec. Regenerate the project with: cd ios && xcodegen generate
# The .xcodeproj is generated output and is not committed.
name: WhimprFlow
options:
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  xcodeVersion: "27.0"
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    # Xcode's "recommended settings", so it stops offering to upgrade the project.
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    STRING_CATALOG_GENERATE_SYMBOLS: YES
targets:
  WhimprFlow:
    type: application
    platform: iOS
    sources: [App, Shared, Generated]
    dependencies:
      - target: WhimprKeyboard
      # Rust core, built by scripts/build-ios.sh. Static, so nothing to embed.
      - framework: Frameworks/WhimprCore.xcframework
        embed: false
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: WhimprFlow
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSMicrophoneUsageDescription: WhimprFlow listens while you dictate and turns your speech into text.
        NSSpeechRecognitionUsageDescription: WhimprFlow turns your speech into text on this iPhone.
        UIBackgroundModes: [audio]
        CFBundleURLTypes:
          - CFBundleURLName: com.whimpr.whimprflow.ios
            CFBundleURLSchemes: [whimprflow]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(WHIMPR_BUNDLE_ID)
  WhimprKeyboard:
    type: app-extension
    platform: iOS
    sources: [Keyboard, Shared]
    info:
      path: Keyboard/Info.plist
      properties:
        CFBundleDisplayName: WhimprFlow
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
          NSExtensionAttributes:
            IsASCIICapable: false
            PrefersRightToLeft: false
            PrimaryLanguage: en-US
            RequestsOpenAccess: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(WHIMPR_BUNDLE_ID).keyboard
  # An extension can't be linked into a test bundle, so the tests compile the
  # keyboard sources directly and run inside the host app on the simulator.
  WhimprKeyboardTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests/KeyboardTests
      - Shared
      - path: Keyboard
        excludes: [Info.plist]
      # The app's end of the bridge, so the tests can run both ends.
      - App/Flow/BridgeServer.swift
    dependencies:
      - target: WhimprFlow
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(WHIMPR_BUNDLE_ID).keyboard-tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/WhimprFlow.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/WhimprFlow
        BUNDLE_LOADER: $(TEST_HOST)
  WhimprFlowTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests/AppTests]
    dependencies:
      - target: WhimprFlow
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(WHIMPR_BUNDLE_ID).tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/WhimprFlow.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/WhimprFlow
        BUNDLE_LOADER: $(TEST_HOST)
schemes:
  WhimprFlow:
    build:
      targets:
        WhimprFlow: all
    test:
      targets:
        - WhimprKeyboardTests
        - WhimprFlowTests
